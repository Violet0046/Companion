<!DOCTYPE html>
<html lang="zh-CN" class="app-shell">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>同行</title>
  <meta name="theme-color" content="#f2f3f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="同行">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.png">
  <!-- 满幅不透明、圆角由系统自己切；带透明角或烤死圆角的图在 iOS 上会露出黑边 -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <div id="gate" class="gate hidden">
    <div class="gate-card">
      <div class="gate-avatar" id="gate-avatar"><img src="/icon.png" alt="同行"></div>
      <h2 id="gate-title">登录同行</h2>
      <p class="gate-hint" id="gate-hint">和熟悉的 TA 继续聊</p>
      <form id="login-form">
        <input class="account-input" id="login-username" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" maxlength="32" placeholder="账号" aria-label="账号" required>
        <input class="account-input" id="login-password" type="password" autocomplete="current-password" maxlength="128" placeholder="密码" aria-label="密码" required>
        <button id="login-submit" class="btn-primary" type="submit">登录</button>
      </form>
      <form id="password-form" class="hidden">
        <!-- minlength/maxlength 要和 accounts.service.MIN_PASSWORD / MAX_PASSWORD 保持一致 -->
        <input class="account-input" id="password-current" type="password" autocomplete="current-password" maxlength="128" placeholder="当前密码" aria-label="当前密码" required>
        <input class="account-input" id="password-new" type="password" autocomplete="new-password" minlength="6" maxlength="128" placeholder="新密码（至少 6 个字符）" aria-label="新密码" required>
        <input class="account-input" id="password-confirm" type="password" autocomplete="new-password" minlength="6" maxlength="128" placeholder="再次输入新密码" aria-label="确认新密码" required>
        <button id="password-submit" class="btn-primary" type="submit">保存新密码</button>
        <button id="password-cancel" class="account-link" type="button">返回</button>
      </form>
      <button id="login-retry" class="account-link hidden" type="button">重新连接</button>
      <p class="gate-hint">账号由邀请你的朋友创建，请勿分享密码</p>
      <p id="gate-error" class="gate-error"></p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <div class="views">

      <!-- ===== 消息（Tab 1） ===== -->
      <section id="view-messages" class="view">
        <div class="nav">
          <div class="nav-title">消息</div>
          <div class="spacer"></div>
          <div class="nav-actions">
            <button id="btn-new-conv" class="nav-btn nav-btn-ico" aria-label="添加" aria-haspopup="menu" aria-expanded="false" aria-controls="create-menu">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6Z"/></svg>
            </button>
            <div id="create-menu" class="create-menu hidden" role="menu" aria-labelledby="btn-new-conv">
              <button id="create-persona-action" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path fill="currentColor" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5Z"/></svg>
                <span>新建角色</span>
              </button>
              <button id="create-group-action" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path fill="currentColor" d="M12 3C5.9 3 1 7 1 12c0 2.5 1.3 4.8 3.4 6.4L3 23l5-2.8c1.2.5 2.6.8 4 .8 6.1 0 11-4 11-9S18.1 3 12 3Z"/></svg>
                <span>发起群聊</span>
              </button>
            </div>
          </div>
        </div>
        <div class="list" id="conv-list"></div>
      </section>

      <!-- ===== 通讯录（Tab 2） ===== -->
      <section id="view-contacts" class="view">
        <div class="nav"><div class="nav-title">通讯录</div></div>
        <div class="list" id="contact-list"></div>
      </section>

      <!-- ===== 我（Tab 3） ===== -->
      <section id="view-me" class="view">
        <div class="nav"><div class="nav-title">我</div></div>
        <div class="scroll">
          <div class="me-card">
            <div class="ava ava-xl ava-s3" id="me-avatar">·</div>
            <div class="me-details">
              <div class="me-name" id="me-name">…</div>
              <div class="me-sub" id="me-sub"></div>
              <div class="me-sub" id="me-memory-sub"></div>
            </div>
          </div>
          <div class="group">
            <div class="row">
              <span>显示思考过程</span>
              <label class="switch-row switch-inline"><input type="checkbox" id="toggle-thinking" role="switch" aria-label="显示思考过程" checked><i class="switch" aria-hidden="true"></i></label>
            </div>
            <div class="row"><span>消息通知</span><label class="switch-row switch-inline"><input type="checkbox" id="notification-toggle" role="switch" aria-label="消息通知" disabled><i class="switch" aria-hidden="true"></i></label></div>
            <div class="notification-hint hidden" id="notification-hint" role="status"></div>
            <div class="row"><span>服务器地址</span><span class="row-val" id="me-server">…</span></div>
            <button class="row account-row" id="btn-password" type="button">修改密码</button>
            <button class="row account-row" id="btn-logout" type="button">退出登录</button>
            <div class="row"><span>关于</span><span class="row-val" id="me-version">v0.3.0</span></div>
            <a class="row hidden" id="call-log-link" href="/calls.html"><span>模型调用记录</span><span class="row-val">查看 ›</span></a>
          </div>
          <div class="group">
            <div class="row"><span>今日用量</span><button class="notification-action" id="usage-refresh" type="button" aria-label="刷新今日用量">刷新</button></div>
            <div id="usage-stats" aria-live="polite"></div>
          </div>
        </div>
      </section>

      <!-- ===== 会话 ===== -->
      <section id="view-chat" class="view">
        <header class="topbar">
          <button id="btn-back-list" class="icon-btn" aria-label="返回消息列表">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M15.4 4.6 14 3.2 5.2 12 14 20.8l1.4-1.4L8 12z"/></svg>
          </button>
          <div class="nav-center topbar-meta">
            <div class="topbar-name" id="persona-name">载入中…</div>
            <div class="topbar-sub" id="persona-sub"></div>
          </div>
          <div class="spacer"></div>
          <button id="btn-search" class="icon-btn" aria-label="搜索聊天记录">
            <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
              <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/>
            </svg>
          </button>
          <button id="btn-avatar" class="ava ava-sm" aria-label="角色资料">·</button>
          <button id="btn-group-settings" class="icon-btn hidden" aria-label="群聊设置">⋯</button>
        </header>

        <div id="history-bar" class="history-bar hidden">
          <span id="history-label">正在查看历史聊天</span>
          <button id="btn-back-live">回到最新</button>
        </div>
        <div id="chat-sync" class="chat-sync hidden" role="status"><span id="chat-sync-label"></span><button id="chat-sync-retry" type="button">重试</button></div>
        <main id="chat" class="chat" aria-live="polite"></main>
        <div id="chat-location-loading" class="chat-location-loading hidden" role="status">正在定位聊天记录…</div>
        <div id="load-more-hint" class="load-more-hint hidden">向上滑动加载更旧的聊天</div>

        <footer class="composer">
          <div id="group-actions" class="group-actions hidden">
            <button id="btn-mention-all" class="group-continue" type="button">@ 全部成员</button>
            <button id="btn-group-continue" class="group-continue hidden" type="button">继续聊聊</button>
          </div>
          <button id="btn-jump-latest" class="jump-latest hidden" aria-label="回到最新消息">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
              <path fill="currentColor" d="M12 16.5 5.5 10l1.4-1.4L12 13.7l5.1-5.1L18.5 10z"/>
            </svg>
            <span id="jump-latest-label">回到最新</span>
          </button>
          <div id="composer-quote" class="composer-quote hidden">
            <span id="composer-quote-text"></span><button id="composer-quote-cancel" type="button" aria-label="取消引用">×</button>
          </div>
          <div class="composer-row">
            <textarea id="input" rows="1" placeholder="说点什么…" autocomplete="off"
                      enterkeyhint="send" aria-label="消息输入"></textarea>
            <button id="btn-send" class="send-btn" aria-label="发送">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10.2 15 12 3.4 13.8z"/>
              </svg>
            </button>
          </div>
        </footer>
      </section>

      <!-- ===== 角色资料 ===== -->
      <section id="view-profile" class="view">
        <div class="nav">
          <button id="btn-profile-back" class="icon-btn" aria-label="返回">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M15.4 4.6 14 3.2 5.2 12 14 20.8l1.4-1.4L8 12z"/></svg>
          </button>
          <div class="nav-title">资料</div>
        </div>
        <div class="scroll" id="profile-body"></div>
      </section>

      <!-- ===== 关系状态 ===== -->
      <section id="view-relation" class="view">
        <div class="nav">
          <button id="btn-relation-back" class="icon-btn" aria-label="返回">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M15.4 4.6 14 3.2 5.2 12 14 20.8l1.4-1.4L8 12z"/></svg>
          </button>
          <div class="nav-title">后台记忆</div>
        </div>
        <div class="scroll" id="relation-body"></div>
      </section>

      <!-- ===== TA 的记忆 ===== -->
      <section id="view-memory" class="view">
        <div class="nav">
          <button id="btn-memory-back" class="icon-btn" aria-label="返回">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M15.4 4.6 14 3.2 5.2 12 14 20.8l1.4-1.4L8 12z"/></svg>
          </button>
          <div class="nav-title" id="memory-title">记忆</div>
        </div>
        <div class="scroll">
          <div class="chip-row chips" id="memory-filters"></div>
          <div class="note-list" id="memory-list"></div>
        </div>
      </section>

    </div>

    <!-- ===== 底部 Tab ===== -->
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-view="messages">
        <span class="tab-ico">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.2c-5 0-9 3.4-9 7.6 0 2.4 1.3 4.5 3.4 5.9l-.9 3.6 3.9-2.1c.8.2 1.7.3 2.6.3 5 0 9-3.4 9-7.7s-4-7.6-9-7.6z"/></svg>
          <span class="tab-badge hidden" id="tab-badge-msg"></span>
        </span>
        <span>消息</span>
      </button>
      <button class="tab" data-view="contacts">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 3.6h6.2c1 0 1.8.8 1.8 1.8v13c0-.9-.7-1.6-1.6-1.6H4V3.6zm16 0h-6.2c-1 0-1.8.8-1.8 1.8v13c0-.9.7-1.6 1.6-1.6H20V3.6z"/></svg>
        <span>通讯录</span>
      </button>
      <button class="tab" data-view="me">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12.2c-4.6 0-8 2.4-8 5.4 0 .5.4.9.9.9h14.2c.5 0 .9-.4.9-.9 0-3-3.4-5.4-8-5.4zM12 11c2.3 0 4.2-1.7 4.2-3.8S14.3 3.4 12 3.4 7.8 5.1 7.8 7.2 9.7 11 12 11z"/></svg>
        <span>我</span>
      </button>
    </nav>
  </div>

  <!-- ===== 搜索面板 ===== -->
  <div id="search-panel" class="search-panel hidden">
    <div class="search-head">
      <input id="search-input" type="search" placeholder="搜索聊天记录、TA 记得的事…"
             autocomplete="off" enterkeyhint="search" aria-label="搜索">
      <button id="btn-search-close" class="icon-btn" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/>
        </svg>
      </button>
    </div>
    <div class="search-tabs">
      <button class="chip active" data-scope="all">全部</button>
      <button class="chip" data-scope="messages">聊天记录</button>
      <button class="chip" data-scope="memories">TA 记得的</button>
    </div>
    <div id="search-results" class="search-results">
      <div class="empty">输入关键词，搜索过去的聊天和记忆</div>
    </div>
  </div>

  <!-- ===== 日历（按日期回溯） ===== -->
  <div id="calendar-panel" class="cal-panel hidden">
    <div class="cal-head">
      <button id="btn-cal-close" class="icon-btn" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/>
        </svg>
      </button>
      <div class="cal-title" id="cal-title">2026年10月</div>
      <div class="spacer"></div>
      <button id="btn-cal-today" class="cal-today-btn hidden">本月</button>
    </div>
    <div class="cal-scroll" id="cal-scroll"></div>
    <div class="cal-foot" id="cal-foot"></div>
  </div>

  <div id="message-actions" class="message-actions hidden" role="menu" aria-label="消息操作">
    <button id="message-copy-action" type="button" role="menuitem">复制</button>
    <button id="message-quote-action" type="button" role="menuitem">引用</button>
    <button id="message-mention-action" class="hidden" type="button" role="menuitem">@ TA</button>
  </div>
  <div id="dialog-group-settings" class="dlg hidden" role="dialog" aria-modal="true" aria-labelledby="group-settings-title">
    <div class="dlg-card">
      <div class="dlg-head"><div class="dlg-title" id="group-settings-title">群聊设置</div></div>
      <div class="dlg-body">
        <div id="group-settings-members" class="hint"></div>
        <label class="member-option"><input id="group-proactive-enabled" type="checkbox"><span>允许主动消息发到本群</span></label>
        <p class="hint">在角色资料中开启主动联系后，角色可选择在这里开口。与私聊共用主动联系频率。</p>
      </div>
      <div class="dlg-foot"><button id="group-settings-close" class="btn-primary" type="button">完成</button></div>
    </div>
  </div>
  <div id="mention-sheet" class="mention-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="mention-title" tabindex="-1">
    <div class="mention-panel">
      <div class="mention-heading">
        <button id="mention-close" type="button" aria-label="关闭成员选择"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <span id="mention-title">选择提醒的角色</span>
        <button id="mention-multi" type="button">多选</button>
      </div>
      <input id="mention-search" type="search" placeholder="搜索成员" aria-label="搜索群成员" autocomplete="off">
      <div id="mention-members" class="mention-members"></div>
    </div>
  </div>
  <div id="dialog-group" class="dlg hidden" role="dialog" aria-modal="true" aria-labelledby="group-title">
    <div class="dlg-card">
      <div class="dlg-head"><div class="dlg-title" id="group-title" tabindex="-1">新建群聊</div></div>
      <div class="dlg-body">
        <label class="dlg-label" for="group-name">群聊名称</label>
        <input id="group-name" class="account-input" maxlength="60" placeholder="给这段相处起个名字" autocomplete="off">
        <div class="dlg-label">选择一起聊天的角色（2—8位）</div>
        <div id="group-member-options"></div>
      </div>
      <div class="dlg-foot"><button id="group-cancel" class="dlg-btn" type="button">取消</button><button id="group-save" class="dlg-btn dlg-btn-primary" type="button">创建群聊</button></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <div id="debug-panel" class="hidden"></div>

  <!-- ===== 新建角色 ===== -->
  <div id="dialog-persona" class="dlg hidden">
    <div class="dlg-card">
      <div class="dlg-head">
        <div class="dlg-title">新建角色</div>
      </div>
      <div class="dlg-body">
        <div class="dlg-label">从模板开始</div>
        <div class="tpl-list" id="tpl-list"></div>
        <div class="dlg-label">角色设定</div>
        <div id="pf-fields"></div>
      </div>
      <div class="dlg-foot">
        <button id="btn-persona-cancel" class="dlg-btn">取消</button>
        <button id="btn-persona-save" class="dlg-btn dlg-btn-primary">创建</button>
      </div>
    </div>
  </div>

  <script src="/notifications.js"></script>
  <script src="/conversation-cache.js"></script>
  <script src="/app.js"></script>
</body>
</html>
