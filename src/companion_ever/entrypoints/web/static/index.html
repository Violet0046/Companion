<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>同行</title>
  <meta name="theme-color" content="#f2f3f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="同行">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.png">
  <!-- 满幅不透明、圆角由系统自己切；带透明角或烤死圆角的图在 iOS 上会露出黑边 -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <div id="gate" class="gate hidden">
    <div class="gate-card">
      <div class="gate-avatar" id="gate-avatar">·</div>
      <h2>需要访问 PIN</h2>
      <p class="gate-hint">输入 PIN 以继续</p>
      <input id="pin-input" type="password" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="current-password" placeholder="PIN" aria-label="访问 PIN">
      <button id="pin-submit" class="btn-primary">进入</button>
      <p id="gate-error" class="gate-error"></p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <div class="views">

      <!-- ===== 消息（Tab 1） ===== -->
      <section id="view-messages" class="view">
        <div class="nav">
          <div class="nav-title">消息</div>
          <div class="spacer"></div>
          <button id="btn-conv-search" class="nav-btn nav-btn-ico" aria-label="搜索会话">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
          </button>
          <button id="btn-new-conv" class="nav-btn" aria-label="新建对话">+</button>
        </div>
        <div class="searchbar hidden" id="conv-searchbar">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
          <input id="conv-search" type="search" placeholder="搜索会话" autocomplete="off" aria-label="搜索会话">
        </div>
        <div class="list" id="conv-list"></div>
      </section>

      <!-- ===== 通讯录（Tab 2） ===== -->
      <section id="view-contacts" class="view">
        <div class="nav"><div class="nav-title">通讯录</div></div>
        <div class="searchbar">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
          <input id="contact-search" type="search" placeholder="搜索角色" autocomplete="off" aria-label="搜索角色">
        </div>
        <div class="list" id="contact-list"></div>
      </section>

      <!-- ===== 我（Tab 3） ===== -->
      <section id="view-me" class="view">
        <div class="nav"><div class="nav-title">我</div></div>
        <div class="scroll">
          <div class="me-card">
            <div class="ava ava-xl ava-s3" id="me-avatar">·</div>
            <div>
              <div class="me-name" id="me-name">…</div>
              <div class="me-sub" id="me-sub"></div>
            </div>
          </div>
          <div class="group">
            <div class="row">
              <span>显示思考过程</span>
              <label class="switch-row switch-inline"><input type="checkbox" id="toggle-thinking" checked><i class="switch"></i></label>
            </div>
            <div class="row"><span>自动记录</span><span class="row-val" id="me-interval">…</span></div>
            <div class="row"><span>消息通知</span><button type="button" class="notification-action" id="notification-toggle" disabled>检查中…</button></div>
            <div class="notification-hint" id="notification-hint" role="status"></div>
            <div class="row hidden" id="notification-test-row"><span>测试通知</span><button type="button" class="notification-action" id="notification-test" disabled>发送</button></div>
            <div class="row"><span>服务器地址</span><span class="row-val" id="me-server">…</span></div>
            <div class="row"><span>关于</span><span class="row-val" id="me-version">v0.3.0</span></div>
            <a class="row hidden" id="call-log-link" href="/calls.html"><span>模型调用记录</span><span class="row-val">查看 ›</span></a>
          </div>
          <div class="hint" id="me-hint"></div>
        </div>
      </section>

      <!-- ===== 会话 ===== -->
      <section id="view-chat" class="view">
        <header class="topbar">
          <button id="btn-back-list" class="icon-btn" aria-label="返回消息列表">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M15.4 4.6 14 3.2 5.2 12 14 20.8l1.4-1.4L8 12z"/></svg>
          </button>
          <div class="nav-center topbar-meta">
            <div class="topbar-name" id="persona-name">载入中…</div>
            <div class="topbar-sub" id="persona-sub"></div>
          </div>
          <div class="spacer"></div>
          <button id="btn-search" class="icon-btn" aria-label="搜索聊天记录">
            <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
              <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/>
            </svg>
          </button>
          <button id="btn-avatar" class="ava ava-sm" aria-label="角色资料">·</button>
        </header>

        <div id="history-bar" class="history-bar hidden">
          <span id="history-label">正在查看历史聊天</span>
          <button id="btn-back-live">回到最新</button>
        </div>
        <main id="chat" class="chat" aria-live="polite"></main>
        <div id="load-more-hint" class="load-more-hint hidden">向上滑动加载更旧的聊天</div>

        <footer class="composer">
          <button id="btn-jump-latest" class="jump-latest hidden" aria-label="回到最新消息">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
              <path fill="currentColor" d="M12 16.5 5.5 10l1.4-1.4L12 13.7l5.1-5.1L18.5 10z"/>
            </svg>
            <span id="jump-latest-label">回到最新</span>
          </button>
          <div class="composer-row">
            <textarea id="input" rows="1" placeholder="说点什么…" autocomplete="off"
                      enterkeyhint="send" aria-label="消息输入"></textarea>
            <button id="btn-send" class="send-btn" aria-label="发送">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10.2 15 12 3.4 13.8z"/>
              </svg>
            </button>
          </div>
        </footer>
      </section>

      <!-- ===== 角色资料 ===== -->
      <section id="view-profile" class="view">
        <div class="nav">
          <button id="btn-profile-back" class="icon-btn" aria-label="返回">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M15.4 4.6 14 3.2 5.2 12 14 20.8l1.4-1.4L8 12z"/></svg>
          </button>
          <div class="nav-title">资料</div>
        </div>
        <div class="scroll" id="profile-body"></div>
      </section>

      <!-- ===== 关系状态 ===== -->
      <section id="view-relation" class="view">
        <div class="nav">
          <button id="btn-relation-back" class="icon-btn" aria-label="返回">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M15.4 4.6 14 3.2 5.2 12 14 20.8l1.4-1.4L8 12z"/></svg>
          </button>
          <div class="nav-title">后台记忆</div>
        </div>
        <div class="scroll" id="relation-body"></div>
      </section>

      <!-- ===== TA 的记忆 ===== -->
      <section id="view-memory" class="view">
        <div class="nav">
          <button id="btn-memory-back" class="icon-btn" aria-label="返回">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M15.4 4.6 14 3.2 5.2 12 14 20.8l1.4-1.4L8 12z"/></svg>
          </button>
          <div class="nav-title" id="memory-title">记忆</div>
        </div>
        <div class="scroll">
          <div class="chip-row chips" id="memory-filters"></div>
          <div class="note-list" id="memory-list"></div>
        </div>
      </section>

    </div>

    <!-- ===== 底部 Tab ===== -->
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-view="messages">
        <span class="tab-ico">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.2c-5 0-9 3.4-9 7.6 0 2.4 1.3 4.5 3.4 5.9l-.9 3.6 3.9-2.1c.8.2 1.7.3 2.6.3 5 0 9-3.4 9-7.7s-4-7.6-9-7.6z"/></svg>
          <span class="tab-badge hidden" id="tab-badge-msg"></span>
        </span>
        <span>消息</span>
      </button>
      <button class="tab" data-view="contacts">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 3.6h6.2c1 0 1.8.8 1.8 1.8v13c0-.9-.7-1.6-1.6-1.6H4V3.6zm16 0h-6.2c-1 0-1.8.8-1.8 1.8v13c0-.9.7-1.6 1.6-1.6H20V3.6z"/></svg>
        <span>通讯录</span>
      </button>
      <button class="tab" data-view="me">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12.2c-4.6 0-8 2.4-8 5.4 0 .5.4.9.9.9h14.2c.5 0 .9-.4.9-.9 0-3-3.4-5.4-8-5.4zM12 11c2.3 0 4.2-1.7 4.2-3.8S14.3 3.4 12 3.4 7.8 5.1 7.8 7.2 9.7 11 12 11z"/></svg>
        <span>我</span>
      </button>
    </nav>
  </div>

  <!-- ===== 搜索面板 ===== -->
  <div id="search-panel" class="search-panel hidden">
    <div class="search-head">
      <input id="search-input" type="search" placeholder="搜索聊天记录、TA 记得的事…"
             autocomplete="off" enterkeyhint="search" aria-label="搜索">
      <button id="btn-search-close" class="icon-btn" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/>
        </svg>
      </button>
    </div>
    <div class="search-tabs">
      <button class="chip active" data-scope="all">全部</button>
      <button class="chip" data-scope="messages">聊天记录</button>
      <button class="chip" data-scope="memories">TA 记得的</button>
    </div>
    <div id="search-results" class="search-results">
      <div class="empty">输入关键词，搜索过去的聊天和记忆</div>
    </div>
  </div>

  <!-- ===== 日历（按日期回溯） ===== -->
  <div id="calendar-panel" class="cal-panel hidden">
    <div class="cal-head">
      <button id="btn-cal-close" class="icon-btn" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/>
        </svg>
      </button>
      <div class="cal-title" id="cal-title">2026年10月</div>
      <div class="spacer"></div>
      <button id="btn-cal-today" class="cal-today-btn hidden">本月</button>
    </div>
    <div class="cal-scroll" id="cal-scroll"></div>
    <div class="cal-foot" id="cal-foot"></div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="debug-panel" class="hidden"></div>

  <!-- ===== 新建角色 ===== -->
  <div id="dialog-persona" class="dlg hidden">
    <div class="dlg-card">
      <div class="dlg-head">
        <div class="dlg-title">新建角色</div>
      </div>
      <div class="dlg-body">
        <div class="dlg-label">从模板开始</div>
        <div class="tpl-list" id="tpl-list"></div>
        <div class="dlg-label">角色设定</div>
        <div id="pf-fields"></div>
      </div>
      <div class="dlg-foot">
        <button id="btn-persona-cancel" class="dlg-btn">取消</button>
        <button id="btn-persona-save" class="dlg-btn dlg-btn-primary">创建</button>
      </div>
    </div>
  </div>

  <script src="/notifications.js"></script>
  <script src="/app.js"></script>
</body>
</html>
