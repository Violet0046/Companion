[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-ever-memory"
version = "0.2.0"
description = "基于 SQLite + LangGraph 的对话式长期记忆系统"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Internal" }
authors = [{ name = "Companion Ever Memory" }]
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "langgraph>=0.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
companion-cli = "companion_ever.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# PWA 前端静态文件（web/）跟着包一起装
[tool.setuptools.package-data]
companion_ever = ["web/*", "web/**/*"]