# 同行 —— nginx 反向代理
#
# 三个容易踩的点：
#   1. proxy_buffering off  —— 不关的话流式回复会一段一段蹦出来
#   2. 长 read timeout      —— 记忆整理要跑几十秒，默认 60s 会把连接掐断
#   3. Upgrade 头 + map     —— /ws/chat 是 WebSocket，普通反代会握手失败
#
# 用法：把 server_name / 证书路径换成你自己的，然后
#   cp deploy/nginx.conf /etc/nginx/conf.d/companion.conf
#   nginx -t && systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name your.domain;

    # 备案还没下来时，先用 IP + 端口访问：
    #   1) 注释掉下面这段 return
    #   2) 访问 http://<服务器IP>:8000（直接打应用，不走 nginx）
    #   注意：没有 HTTPS → Service Worker 不注册 → PWA 离线/推送不可用，
    #        但「添加到主屏幕」的图标和外观仍然正常。
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name your.domain;

    ssl_certificate     /etc/letsencrypt/live/your.domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain/privkey.pem;

    # 聊天正文很小，但建角色时的 JSON 定义可能长一点
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket：/ws/chat
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 流式回复必须关缓冲，否则一段段蹦
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 记忆整理要跑几十秒，不能用默认的 60s
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
